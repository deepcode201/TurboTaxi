name: Deploy TurboTaxi DEV

on:
  push:
    branches: ["develop"]

concurrency:
  group: turbotaxi-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, turbotaxi]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker cleanup before deploy
        run: |
          set -euo pipefail
          docker builder prune -af || true
          docker container prune -f || true
          docker image prune -f || true

      - name: Prepare deploy directory
        id: prep
        run: |
          set -euo pipefail
          DIR="/var/lib/docker/deploy/turbotaxi/dev"
          echo "DIR=$DIR" >> "$GITHUB_OUTPUT"
          rm -rf "$DIR"/*
          mkdir -p "$DIR"

      - name: Copy code
        run: |
          set -euo pipefail
          rsync -a --delete --exclude ".git" "$GITHUB_WORKSPACE/" "${{ steps.prep.outputs.DIR }}/"

      - name: Write .env
        working-directory: ${{ steps.prep.outputs.DIR }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ secrets.DEV_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Deploy
        working-directory: ${{ steps.prep.outputs.DIR }}
        run: |
          set -euo pipefail
          test -f docker-compose.dev.yml
          docker compose -p turbotaxi-dev -f docker-compose.dev.yml down || true
          docker compose -p turbotaxi-dev -f docker-compose.dev.yml up -d --build
          docker compose -p turbotaxi-dev -f docker-compose.dev.yml ps

      - name: Remove source code
        if: always()
        run: |
          set -euo pipefail
          find /var/lib/docker/deploy/turbotaxi/dev -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +
