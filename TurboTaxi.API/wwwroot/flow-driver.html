<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TurboTaxi Flow Test � Driver</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script>window.API_BASE=window.location.origin;console.log("API_BASE:",window.API_BASE);</script>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#6366f1; --accent2:#4f46e5; --ok:#10b981; --danger:#dc2626; --warn:#f59e0b; --text:#f1f5f9; }
  * { box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { margin:0; background:#0f172a; color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { padding:18px 28px; display:flex; justify-content:space-between; align-items:center; background:#1e293b; }
  h1 { margin:0; font-size:20px; font-weight:600; display:flex; gap:10px; align-items:center; }
  h1 span { background:var(--accent); padding:4px 10px; border-radius:10px; font-size:11px; letter-spacing:.5px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:20px; padding:20px; flex:1; }
  .panel { background:#1e293b; padding:18px 20px; border-radius:18px; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); overflow:auto; }
  label { font-size:11px; text-transform:uppercase; font-weight:600; color:#94a3b8; letter-spacing:.6px; margin:14px 0 6px; display:block; }
  input, select { width:100%; padding:11px 14px; border:1px solid #334155; border-radius:14px; background:#0f172a; color:var(--text); font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { width:100%; border:none; padding:13px 16px; border-radius:16px; font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:var(--text); display:flex; gap:8px; justify-content:center; transition:.25s; }
  button:hover { background:var(--accent2); }
  button.secondary { background:#334155; }
  button.secondary:hover { background:#475569; }
  button.danger { background:var(--danger); }
  button.danger:hover { background:#b91c1c; }
  button.success { background:var(--ok); color:#052e16; }
  button.success:hover { background:#059669; color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .status { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:12px; font-size:11px; font-weight:700; background:#334155; }
  .status.connected { background:var(--ok); color:#052e16; }
  #map { height:100%; width:100%; border-radius:22px; box-shadow:0 10px 30px -10px rgba(0,0,0,.45); }
  .log { font-size:12px; line-height:1.45; max-height:180px; overflow:auto; margin-top:12px; }
  .log-entry { padding:6px 8px; background:#0f172a; border:1px solid #334155; margin:0 0 6px; border-radius:10px; }
  .ride-card { border:1px solid #334155; background:#0f172a; border-radius:14px; padding:12px 14px; margin:10px 0; }
  .ride-card h4 { margin:0 0 8px; font-size:14px; }
  .badge { display:inline-block; padding:4px 8px; font-size:11px; font-weight:600; background:#334155; border-radius:8px; }
  .badge.pending { background:var(--warn); color:#422006; }
  .badge.approved { background:var(--accent); }
  .badge.onway { background:var(--accent2); }
  .badge.completed { background:var(--ok); color:#052e16; }
  footer { padding:12px 20px; font-size:11px; text-align:center; color:#64748b; background:#0f172a; }
</style>
</head>
<body>
<header>
  <h1>?? Driver Flow <span id="envBadge">...</span></h1>
  <div>Conn: <span id="connStatus" class="status">DISCONNECTED</span></div>
</header>
<main>
  <div class="panel" id="leftPanel">
    <label>Driver ID</label>
    <input id="driverId" type="number" value="1" min="1" />
    <div class="row2">
      <div>
        <label>Latitude</label>
        <input id="lat" type="number" step="0.00001" value="40.40308" />
      </div>
      <div>
        <label>Longitude</label>
        <input id="lng" type="number" step="0.00001" value="49.87080" />
      </div>
    </div>
    <label>Vehicle</label>
    <select id="vehicleType"><option>Standard</option><option>Comfort</option><option>Business</option><option>Van</option></select>
    <label>Status</label>
    <select id="driverStatus"><option>Free</option><option>Busy</option><option>Offline</option></select>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button id="connectBtn">?? Connect</button>
      <button id="disconnectBtn" class="secondary" disabled>?</button>
    </div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="updateBtn" disabled>?? Update</button>
      <button id="moveBtn" class="secondary" disabled>?? Move</button>
    </div>
    <h3 style="margin:22px 0 10px; font-size:15px;">Pending Requests</h3>
    <div id="pendingContainer"></div>
    <h3 style="margin:22px 0 10px; font-size:15px;">Active Ride</h3>
    <div id="activeContainer"><small style="color:#64748b;">None</small></div>
    <h3 style="margin:22px 0 10px; font-size:15px;">Log</h3>
    <div class="log" id="log"></div>
  </div>
  <div class="panel" style="padding:0;">
    <div id="map"></div>
  </div>
</main>
<footer>TurboTaxi � Real-time Flow Driver Test</footer>
<script>
(function env(){
  const port=location.port;
  const b=document.getElementById('envBadge');
  if(port==='7443'){
    b.textContent='PROD';
    b.style.background='var(--ok)';
    b.style.color='#052e16';
  } else if(port==='7046'||port===''){
    b.textContent='DEV';
    b.style.background='var(--accent)';
  } else {
    b.textContent=port;
    b.style.background='var(--danger)';
  }
})();

// Map setup
let map=L.map('map').setView([40.40308,49.87080],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'� OpenStreetMap'
}).addTo(map);

let driverMarker=L.marker([40.40308,49.87080],{title:'Driver'}).addTo(map);
let pickupMarker=null,destMarker=null,routeLine=null;

function setRoute(pLat,pLng,dLat,dLng,poly){
  if(pickupMarker){map.removeLayer(pickupMarker);}
  if(destMarker){map.removeLayer(destMarker);}
  pickupMarker=L.marker([pLat,pLng],{title:'Pickup'}).addTo(map);
  destMarker=L.marker([dLat,dLng],{title:'Destination'}).addTo(map);
  if(routeLine){map.removeLayer(routeLine);}
  if(poly){
    const pts=decodePolyline(poly).map(x=>[x[0],x[1]]);
    routeLine=L.polyline(pts,{color:'#6366f1',weight:5,opacity:.8}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
  } else {
    map.fitBounds(L.latLngBounds([[pLat,pLng],[dLat,dLng]]),{padding:[40,40]});
  }
}

function decodePolyline(str){
  let index=0,lat=0,lng=0,coords=[];
  while(index<str.length){
    let b,shift=0,result=0;
    do{
      b=str.charCodeAt(index++)-63;
      result|=(b & 0x1f)<<shift;
      shift+=5;
    }while(b>=0x20);
    let dlat=(result & 1)?~(result>>1):(result>>1);
    lat+=dlat;
    shift=0;
    result=0;
    do{
      b=str.charCodeAt(index++)-63;
      result|=(b & 0x1f)<<shift;
      shift+=5;
    }while(b>=0x20);
    let dlng=(result & 1)?~(result>>1):(result>>1);
    lng+=dlng;
    coords.push([lat/1e5,lng/1e5]);
  }
  return coords;
}

const logEl=document.getElementById('log');
function log(m){
  const e=document.createElement('div');
  e.className='log-entry';
  e.innerHTML=`<strong>${new Date().toLocaleTimeString()}</strong> ${m}`;
  logEl.appendChild(e);
  logEl.scrollTop=logEl.scrollHeight;
}

function status(c){
  const el=document.getElementById('connStatus');
  el.textContent=c?'CONNECTED':'DISCONNECTED';
  el.className='status '+(c?'connected':'');
}

let connection=null;
let activeRide=null;

async function connect(){
  if(connection) return;
  log('Connecting ? '+window.API_BASE);
  connection=new signalR.HubConnectionBuilder()
    .withUrl(`${window.API_BASE}/hubs/driver`)
    .withAutomaticReconnect()
    .build();
  
  connection.on('NewRideRequest',(eventType,payload)=>{
    const ride={
      rideId:payload.RideId||payload.rideId,
      pickupLat:payload.PickupLat||payload.pickupLat,
      pickupLng:payload.PickupLng||payload.pickupLng,
      destinationLat:payload.DestinationLat||payload.destinationLat,
      destinationLng:payload.DestinationLng||payload.destinationLng
    };
    addPendingRide(ride);
    log(`New ride request #${ride.rideId}`);
  });
  
  connection.on('RideStatusUpdated',(rideId,eventType,payload)=>{
    const status=payload.Status||payload.status||eventType;
    log(`Ride #${rideId} status ? ${status}`);
    
    if(activeRide && activeRide.rideId===rideId){
      updateActiveRide(status);
    }
    
    if(status==='Canceled'||status==='CanceledByUser'){
      if(activeRide&&activeRide.rideId===rideId){
        clearActiveRide();
        log(`Active ride #${rideId} canceled by user`);
      }
      removePendingRide(rideId);
    }
    
    if(status==='Taken'){
      removePendingRide(rideId);
    }
  });
  
  connection.on('DriverLocationUpdated',(driverId,la,lo)=>{
    driverMarker.setLatLng([la,lo]);
  });
  
  connection.onreconnected(()=>{
    log('Reconnected');
    subscribe();
  });
  
  connection.onclose(()=>{
    status(false);
    toggle(false);
    connection=null;
    log('Closed');
  });
  
  try{
    await connection.start();
    status(true);
    toggle(true);
    log('Connected');
    await subscribe();
  }catch(e){
    log('Connect failed: '+e.message);
    connection=null;
  }
}

async function subscribe(){
  try{
    await connection.invoke('SubscribeDriver', driverId.value);
    log('Subscribed driver:'+driverId.value);
  }catch(e){
    log('Subscribe error: '+e.message);
  }
}

function toggle(on){
  connectBtn.disabled=on;
  disconnectBtn.disabled=!on;
  updateBtn.disabled=!on;
  moveBtn.disabled=!on;
}

async function disconnect(){
  if(connection) await connection.stop();
}

async function updateLocation(){
  const payload={
    driverId:parseInt(driverId.value),
    lat:parseFloat(lat.value),
    lng:parseFloat(lng.value),
    vehicleType:vehicleType.value,
    statusOptional:driverStatus.value
  };
  try{
    const r=await fetch(`${window.API_BASE}/api/driver/location`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(r.ok){
      log(`Location ? ${payload.lat.toFixed(5)}, ${payload.lng.toFixed(5)} (${payload.vehicleType}/${driverStatus.value})`);
    }else{
      log('Update failed '+r.status);
    }
  }catch(e){
    log('Update error '+e.message);
  }
}

function moveRandom(){
  lat.value=(parseFloat(lat.value)+((Math.random()-0.5)*0.00040)).toFixed(5);
  lng.value=(parseFloat(lng.value)+((Math.random()-0.5)*0.00040)).toFixed(5);
  updateLocation();
}

function addPendingRide(ride){
  const div=document.createElement('div');
  div.className='ride-card';
  div.id='ride-'+ride.rideId;
  div.innerHTML=`
    <h4>#${ride.rideId} <span class='badge pending'>PENDING</span></h4>
    <div style='font-size:12px;line-height:1.4;'>
      Pickup: ${ride.pickupLat}, ${ride.pickupLng}<br/>
      Dest: ${ride.destinationLat||'N/A'}, ${ride.destinationLng||'N/A'}
    </div>
    <div style='display:flex; gap:8px; margin-top:10px;'>
      <button class='success' onclick='acceptRide(${ride.rideId},${ride.pickupLat},${ride.pickupLng},${ride.destinationLat},${ride.destinationLng})'>? Accept</button>
      <button class='danger' onclick='rejectRide(${ride.rideId})'>? Reject</button>
    </div>
  `;
  pendingContainer.appendChild(div);
}

function removePendingRide(id){
  const el=document.getElementById('ride-'+id);
  if(el) el.remove();
}

function updateActiveRide(status){
  const box=document.getElementById('activeBox');
  if(!box) return;
  
  // Update badge
  const badge=box.querySelector('.badge');
  badge.textContent=status.toUpperCase();
  badge.className='badge '+status.toLowerCase();
  
  // Update buttons based on status
  const btnContainer=box.querySelector('.btn-container');
  if(!btnContainer) return;
  
  if(status==='Approved'){
    btnContainer.innerHTML=`
      <button class='success' onclick='startRide(${activeRide.rideId})'>?? Start</button>
      <button class='danger' onclick='cancelRide(${activeRide.rideId})'>? Cancel</button>
    `;
  } else if(status==='OnWay'){
    btnContainer.innerHTML=`
      <button class='success' onclick='finishRide(${activeRide.rideId})'>?? Finish</button>
      <button class='danger' onclick='cancelRide(${activeRide.rideId})'>? Cancel</button>
    `;
  } else if(status==='Completed'){
    btnContainer.innerHTML=`<small style="color:var(--ok);">? Completed</small>`;
  }
}

function clearActiveRide(){
  activeContainer.innerHTML='<small style="color:#64748b;">None</small>';
  activeRide=null;
  if(pickupMarker) map.removeLayer(pickupMarker);
  if(destMarker) map.removeLayer(destMarker);
  if(routeLine) map.removeLayer(routeLine);
}

window.acceptRide=async (rideId,pLat,pLng,dLat,dLng)=>{
  try{
    const r=await fetch(`${window.API_BASE}/api/rides/${rideId}/accept`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driverId:parseInt(driverId.value)})
    });
    if(r.ok){
      removePendingRide(rideId);
      activeRide={rideId,pLat,pLng,dLat,dLng};
      activeContainer.innerHTML=`
        <div class='ride-card' id='activeBox'>
          <h4>Ride #${rideId} <span class='badge approved'>APPROVED</span></h4>
          <div style='font-size:12px;line-height:1.4;'>
            Pickup: ${pLat}, ${pLng}<br/>
            Dest: ${dLat}, ${dLng}
          </div>
          <div class='btn-container' style='display:flex; gap:8px; margin-top:8px;'>
            <button class='success' onclick='startRide(${rideId})'>?? Start</button>
            <button class='danger' onclick='cancelRide(${rideId})'>? Cancel</button>
          </div>
        </div>
      `;
      setRoute(pLat,pLng,dLat,dLng,null);
      log('? Accepted ride #'+rideId);
    } else {
      const err=await r.text();
      log('Accept failed '+r.status+': '+err);
    }
  }catch(e){
    log('Accept error '+e.message);
  }
};

window.rejectRide=(rideId)=>{
  removePendingRide(rideId);
  log('? Rejected ride #'+rideId);
};

window.startRide=async (rideId)=>{
  try{
    log('?? Starting ride #'+rideId);
    const r=await fetch(`${window.API_BASE}/api/rides/${rideId}/start`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driverId:parseInt(driverId.value)})
    });
    if(r.ok){
      log('? Started ride #'+rideId);
      updateActiveRide('OnWay');
    }else{
      const err=await r.text();
      log('Start failed '+r.status+': '+err);
    }
  }catch(e){
    log('Start error '+e.message);
  }
};

window.finishRide=async (rideId)=>{
  const price=prompt('Final price AZN','15.00');
  if(!price) return;
  
  try{
    log('?? Finishing ride #'+rideId);
    const r=await fetch(`${window.API_BASE}/api/rides/${rideId}/finish`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        driverId:parseInt(driverId.value),
        finalPrice:parseFloat(price)
      })
    });
    if(r.ok){
      log('? Finished ride #'+rideId+' - Price: '+price+' AZN');
      updateActiveRide('Completed');
      setTimeout(clearActiveRide,4000);
    }else{
      const err=await r.text();
      log('Finish failed '+r.status+': '+err);
    }
  }catch(e){
    log('Finish error '+e.message);
  }
};

window.cancelRide=async (rideId)=>{
  if(!confirm('Cancel ride?')) return;
  
  try{
    const r=await fetch(`${window.API_BASE}/api/rides/${rideId}/cancel-by-driver`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({driverId:parseInt(driverId.value)})
    });
    if(r.ok){
      log('? Canceled ride #'+rideId);
      clearActiveRide();
    }else{
      const err=await r.text();
      log('Cancel failed '+r.status+': '+err);
    }
  }catch(e){
    log('Cancel error '+e.message);
  }
};

const driverId=document.getElementById('driverId');
const lat=document.getElementById('lat');
const lng=document.getElementById('lng');
const vehicleType=document.getElementById('vehicleType');
const driverStatus=document.getElementById('driverStatus');
const connectBtn=document.getElementById('connectBtn');
const disconnectBtn=document.getElementById('disconnectBtn');
const updateBtn=document.getElementById('updateBtn');
const moveBtn=document.getElementById('moveBtn');
const pendingContainer=document.getElementById('pendingContainer');
const activeContainer=document.getElementById('activeContainer');

connectBtn.onclick=connect;
disconnectBtn.onclick=disconnect;
updateBtn.onclick=updateLocation;
moveBtn.onclick=moveRandom;

log('Ready. Connect and start updating location.');
</script>
</body>
</html>
