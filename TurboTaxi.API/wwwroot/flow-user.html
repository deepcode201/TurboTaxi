<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TurboTaxi Flow Test � User</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script>window.API_BASE=window.location.origin;console.log("API_BASE:",window.API_BASE);</script>
<style>
  :root { --bg:#111827; --panel:#1f2937; --accent:#3b82f6; --accent2:#2563eb; --ok:#10b981; --warn:#f59e0b; --danger:#dc2626; --text:#f1f5f9; }
  * { box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { margin:0; background:#111827; color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { padding:18px 28px; display:flex; justify-content:space-between; align-items:center; background:#1f2937; }
  h1 { margin:0; font-size:20px; font-weight:600; display:flex; gap:10px; align-items:center; }
  h1 span { background:var(--accent); padding:4px 10px; border-radius:10px; font-size:11px; letter-spacing:.5px; }
  main { display:grid; grid-template-columns:360px 1fr; gap:20px; padding:20px; flex:1; }
  .panel { background:#1f2937; padding:18px 20px; border-radius:18px; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); overflow:auto; }
  label { font-size:11px; text-transform:uppercase; font-weight:600; color:#9ca3af; letter-spacing:.6px; margin:14px 0 6px; display:block; }
  input, select { width:100%; padding:11px 14px; border:1px solid #374151; border-radius:14px; background:#111827; color:var(--text); font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { width:100%; border:none; padding:13px 16px; border-radius:16px; font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:var(--text); display:flex; gap:8px; justify-content:center; transition:.25s; }
  button:hover { background:var(--accent2); }
  button.secondary { background:#374151; }
  button.secondary:hover { background:#4b5563; }
  button.danger { background:var(--danger); }
  button.danger:hover { background:#b91c1c; }
  button.success { background:var(--ok); color:#052e16; }
  button.success:hover { background:#059669; color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .status { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:12px; font-size:11px; font-weight:700; background:#374151; }
  .status.connected { background:var(--ok); color:#052e16; }
  #map { height:100%; width:100%; border-radius:22px; box-shadow:0 10px 30px -10px rgba(0,0,0,.45); }
  .log { font-size:12px; line-height:1.45; max-height:180px; overflow:auto; margin-top:12px; }
  .log-entry { padding:6px 8px; background:#111827; border:1px solid #374151; margin:0 0 6px; border-radius:10px; }
  .badge { display:inline-block; padding:4px 8px; font-size:11px; font-weight:600; background:#374151; border-radius:8px; }
  .badge.searching { background:var(--warn); color:#422006; }
  .badge.accepted { background:var(--accent); }
  .badge.onway { background:var(--accent2); }
  .badge.completed { background:var(--ok); color:#052e16; }
  .ride-box { border:1px solid #374151; background:#111827; border-radius:14px; padding:12px 14px; margin:10px 0; }
  footer { padding:12px 20px; font-size:11px; text-align:center; color:#64748b; background:#111827; }
</style>
</head>
<body>
<header>
  <h1>????? User Flow <span id="envBadge">...</span></h1>
  <div>Conn: <span id="connStatus" class="status">DISCONNECTED</span></div>
</header>
<main>
  <div class="panel">
    <label>User ID</label>
    <input id="userId" type="number" value="6" min="1" />
    <label>Pickup Latitude</label>
    <input id="pickupLat" type="number" step="0.00001" value="40.40308" />
    <label>Pickup Longitude</label>
    <input id="pickupLng" type="number" step="0.00001" value="49.87080" />
    <label>Destination Latitude</label>
    <input id="destLat" type="number" step="0.00001" value="40.37720" />
    <label>Destination Longitude</label>
    <input id="destLng" type="number" step="0.00001" value="49.89200" />
    <label>Vehicle Type</label>
    <select id="vehicleType"><option>Standard</option><option>Comfort</option><option>Business</option><option>Van</option></select>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button id="connectBtn">?? Connect</button>
      <button id="estimateBtn" class="secondary" disabled>?? Estimate</button>
    </div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="orderBtn" class="success" disabled>?? Order</button>
      <button id="cancelBtn" class="danger" disabled>? Cancel</button>
    </div>
    <h3 style="margin:22px 0 10px; font-size:15px;">Ride</h3>
    <div id="rideBox"><small style="color:#64748b;">None</small></div>
    <h3 style="margin:22px 0 10px; font-size:15px;">Log</h3>
    <div class="log" id="log"></div>
  </div>
  <div class="panel" style="padding:0;">
    <div id="map"></div>
  </div>
</main>
<footer>TurboTaxi � Real-time Flow User Test</footer>
<script>
(function env(){const port=location.port;const b=document.getElementById('envBadge');if(port==='7443'){b.textContent='PROD';b.style.background='var(--ok)';b.style.color='#052e16';}else if(port==='7046'||port===''){b.textContent='DEV';b.style.background='var(--accent)';}else{b.textContent=port;b.style.background='var(--danger)';}})();
let map=L.map('map').setView([40.40308,49.87080],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'� OpenStreetMap'}).addTo(map);
let pickupMarker=null,destMarker=null,driverMarker=null,routeLine=null;
function decodePolyline(str){let index=0,lat=0,lng=0,coords=[];while(index<str.length){let b,shift=0,result=0;do{b=str.charCodeAt(index++)-63;result|=(b & 0x1f)<<shift;shift+=5;}while(b>=0x20);let dlat=(result & 1)?~(result>>1):(result>>1);lat+=dlat;shift=0;result=0;do{b=str.charCodeAt(index++)-63;result|=(b & 0x1f)<<shift;shift+=5;}while(b>=0x20);let dlng=(result & 1)?~(result>>1):(result>>1);lng+=dlng;coords.push([lat/1e5,lng/1e5]);}return coords;}
function setRoute(pLat,pLng,dLat,dLng,poly){if(pickupMarker){map.removeLayer(pickupMarker);}if(destMarker){map.removeLayer(destMarker);}pickupMarker=L.marker([pLat,pLng],{title:'Pickup'}).addTo(map);destMarker=L.marker([dLat,dLng],{title:'Destination'}).addTo(map);if(routeLine){map.removeLayer(routeLine);}if(poly){const pts=decodePolyline(poly).map(x=>[x[0],x[1]]);routeLine=L.polyline(pts,{color:'#3b82f6',weight:5,opacity:.8}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[30,30]});}else{map.fitBounds(L.latLngBounds([[pLat,pLng],[dLat,dLng]]),{padding:[40,40]});}}
const logEl=document.getElementById('log');function log(m){const e=document.createElement('div');e.className='log-entry';e.innerHTML=`<strong>${new Date().toLocaleTimeString()}</strong> ${m}`;logEl.appendChild(e);logEl.scrollTop=logEl.scrollHeight;}
function status(c){const el=document.getElementById('connStatus');el.textContent=c?'CONNECTED':'DISCONNECTED';el.className='status '+(c?'connected':'');}
let connection=null;let currentRideId=null;let currentDriverId=null;let lastPolyline=null;let currentStatus=null;let lastEstimate=null;
function renderRide(){const box=document.getElementById('rideBox');if(!currentRideId){box.innerHTML='<small style="color:#64748b;">None</small>';return;}const badgeClass=(currentStatus||'searching').toLowerCase();box.innerHTML=`<div class='ride-box'><div style='display:flex;justify-content:space-between;align-items:center;'><h4 style='margin:0;font-size:14px;'>Ride #${currentRideId}</h4><span class='badge ${badgeClass}'>${(currentStatus||'Searching').toUpperCase()}</span></div><div style='font-size:12px;line-height:1.4;margin-top:6px;'>Driver: ${currentDriverId||'�'}<br/>Status: ${currentStatus||'Searching'}</div>${currentStatus && currentStatus!=='Completed' && currentStatus!=='Canceled'?`<div style='display:flex;gap:8px;margin-top:10px;'>${currentStatus==='Approved'?`<button class='secondary' onclick='cancelRide()'>? Cancel</button>`:currentStatus==='OnWay'?`<button class='secondary' onclick='cancelRide()'>? Cancel</button>`:`<button class='secondary' onclick='cancelRide()'>? Cancel</button>`}</div>`:''}</div>`;}
async function connect(){if(connection) return; log('Connecting � '+window.API_BASE);connection=new signalR.HubConnectionBuilder().withUrl(`${window.API_BASE}/hubs/driver`).withAutomaticReconnect().build();connection.on('RideStatusUpdated',(rideId,eventType,payload)=>{const status=payload.Status||payload.status||eventType;const dId=payload.DriverId||payload.driverId;const poly=payload.EncodedPolyline||payload.encodedPolyline;log(`Ride #${rideId} ? ${status}`);currentRideId=rideId;currentStatus=status; if(dId) currentDriverId=dId;renderRide(); if(poly){lastPolyline=poly;setRoute(pickupLat.value,pickupLng.value,destLat.value,destLng.value,poly);} if(status==='Completed'){log('Completed. Clearing in 5s');setTimeout(()=>{currentRideId=null;currentStatus=null;currentDriverId=null;renderRide();},5000);} if(status==='Canceled'){log('Canceled by system/user.');}}
);connection.on('DriverLocationUpdated',(driverId,la,lo)=>{ if(currentDriverId && driverId===currentDriverId){ if(!driverMarker){driverMarker=L.marker([la,lo],{title:'Driver'}).addTo(map);} else {driverMarker.setLatLng([la,lo]);} } });connection.onreconnected(()=>{log('Reconnected'); subscribeUser(); });connection.onclose(()=>{status(false);connectBtn.disabled=false;estimateBtn.disabled=true;orderBtn.disabled=true;cancelBtn.disabled=true;connection=null;});try{await connection.start();status(true);log('Connected');await subscribeUser();connectBtn.disabled=true;estimateBtn.disabled=false;}catch(e){log('Connect failed: '+e.message);connection=null;}}
async function subscribeUser(){try{await connection.invoke('SubscribeUser', userId.value);log('Subscribed user:'+userId.value);}catch(e){log('Subscribe error '+e.message);} }
async function estimate(){const payload={origin:{latitude:parseFloat(pickupLat.value),longitude:parseFloat(pickupLng.value)},destination:{latitude:parseFloat(destLat.value),longitude:parseFloat(destLng.value)},vehicleType:vehicleType.value,promoCode:null};try{estimateBtn.disabled=true;estimateBtn.textContent='�';const r=await fetch(`${window.API_BASE}/api/routes/estimate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});estimateBtn.textContent='?? Estimate';estimateBtn.disabled=false;if(r.ok){const j=await r.json();if(j.success && j.data){lastEstimate=j.data;log(`Estimate ? ${j.data.distanceKm} km / ${j.data.durationMinutes} min`);orderBtn.disabled=false;setRoute(payload.origin.latitude,payload.origin.longitude,payload.destination.latitude,payload.destination.longitude,j.data.encodedPolyline);}else{log('Estimate failed');}} else {log('Estimate error '+r.status);} }catch(e){log('Estimate exception '+e.message);} }
async function order(){if(!lastEstimate){log('No estimate');return;}const payload={userId:parseInt(userId.value),pickupLat:parseFloat(pickupLat.value),pickupLng:parseFloat(pickupLng.value),destinationLat:parseFloat(destLat.value),destinationLng:parseFloat(destLng.value),vehicleType:vehicleType.value};try{orderBtn.disabled=true;const r=await fetch(`${window.API_BASE}/api/rides`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});orderBtn.disabled=false;if(r.ok){const j=await r.json();currentRideId=j.rideId;currentStatus=j.status;renderRide();log(`Ride requested #${j.rideId} notifying ${j.candidateDriverIds?.length||0} drivers`);cancelBtn.disabled=false;} else {log('Order failed '+r.status);} }catch(e){log('Order error '+e.message);} }
async function cancelRide(){if(!currentRideId) return; if(!confirm('Cancel ride?')) return; try{const r=await fetch(`${window.API_BASE}/api/rides/${currentRideId}/cancel-by-user`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:parseInt(userId.value)})});if(r.ok){log('Ride canceled');currentStatus='Canceled';renderRide();setTimeout(()=>{currentRideId=null;currentStatus=null;currentDriverId=null;renderRide();},3000);} else {log('Cancel failed '+r.status);} }catch(e){log('Cancel error '+e.message);} }
const userId=document.getElementById('userId');const pickupLat=document.getElementById('pickupLat');const pickupLng=document.getElementById('pickupLng');const destLat=document.getElementById('destLat');const destLng=document.getElementById('destLng');const vehicleType=document.getElementById('vehicleType');const connectBtn=document.getElementById('connectBtn');const estimateBtn=document.getElementById('estimateBtn');const orderBtn=document.getElementById('orderBtn');const cancelBtn=document.getElementById('cancelBtn');connectBtn.onclick=connect;estimateBtn.onclick=estimate;orderBtn.onclick=order;cancelBtn.onclick=cancelRide;log('Ready. Connect then Estimate and Order.');
</script>
</body>
</html>
