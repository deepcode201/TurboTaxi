<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TurboTaxi Production Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0a0e1a; color:#f1f5f9; padding:20px; }
  .container { max-width:800px; margin:0 auto; }
  h1 { font-size:24px; margin-bottom:20px; color:#10b981; }
  .section { background:#1a1f35; padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid #374151; }
  h2 { font-size:18px; margin-bottom:15px; color:#f59e0b; }
  label { display:block; margin:10px 0 5px; font-size:13px; color:#94a3b8; text-transform:uppercase; font-weight:600; }
  input, select { width:100%; padding:10px; border:1px solid #374151; border-radius:8px; background:#0a0e1a; color:#f1f5f9; font-size:14px; }
  button { width:100%; padding:12px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-top:10px; transition:.3s; }
  .btn-primary { background:#10b981; color:#052e16; }
  .btn-primary:hover { background:#059669; }
  .btn-danger { background:#ef4444; color:white; }
  .btn-danger:hover { background:#dc2626; }
  .btn-secondary { background:#374151; color:#f1f5f9; }
  .btn-secondary:hover { background:#4b5563; }
  .status { display:inline-block; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; margin-bottom:10px; }
  .status.connected { background:#10b981; color:#052e16; }
  .status.disconnected { background:#374151; color:#f1f5f9; }
  .log { background:#0a0e1a; padding:15px; border-radius:8px; height:300px; overflow-y:auto; font-family:monospace; font-size:12px; line-height:1.6; border:1px solid #374151; }
  .log-entry { margin-bottom:8px; padding:8px; border-radius:4px; background:#1a1f35; }
  .log-success { border-left:3px solid #10b981; }
  .log-error { border-left:3px solid #ef4444; }
  .log-info { border-left:3px solid #3b82f6; }
  .log-warning { border-left:3px solid #f59e0b; }
  .time { color:#64748b; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .prod-badge { background:#ef4444; color:white; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; margin-left:10px; }
</style>
</head>
<body>
<div class="container">
  <h1>?? TurboTaxi Production Test Panel <span class="prod-badge">LIVE PRODUCTION</span></h1>
  
  <div class="section">
    <h2>?? Connection Status</h2>
    <div>
      <span id="connStatus" class="status disconnected">DISCONNECTED</span>
    </div>
    <div style="margin-top:10px;">
      <strong>Production API:</strong> <span id="apiUrl" style="color:#ef4444; font-weight:700;">http://booktables-001-site1.anytempurl.com</span>
    </div>
    <div style="margin-top:5px; font-size:12px; color:#64748b;">
      ?? This panel connects to LIVE PRODUCTION server!
    </div>
  </div>

  <div class="section">
    <h2>?? SignalR Connection</h2>
    <button id="connectBtn" class="btn-primary">?? Connect to Production SignalR</button>
    <button id="disconnectBtn" class="btn-danger" style="display:none;">? Disconnect</button>
  </div>

  <div class="section">
    <h2>?? Location Update Test</h2>
    <label>Driver ID</label>
    <input type="number" id="driverId" value="1" min="1" />
    
    <div class="grid">
      <div>
        <label>Latitude</label>
        <input type="number" id="latitude" value="40.40308" step="0.00001" />
      </div>
      <div>
        <label>Longitude</label>
        <input type="number" id="longitude" value="49.87080" step="0.00001" />
      </div>
    </div>
    
    <label>Vehicle Type</label>
    <select id="vehicleType">
      <option>Standard</option>
      <option>Comfort</option>
      <option>Business</option>
      <option>Van</option>
    </select>
    
    <label>Driver Status</label>
    <select id="driverStatus">
      <option>Free</option>
      <option>Busy</option>
      <option>Offline</option>
    </select>
    
    <button id="updateBtn" class="btn-primary">?? Update Location (Production)</button>
    <button id="randomBtn" class="btn-secondary">?? Random Location</button>
  </div>

  <div class="section">
    <h2>?? Test Log</h2>
    <button id="clearBtn" class="btn-secondary" style="width:auto; padding:8px 16px;">Clear Log</button>
    <div id="log" class="log" style="margin-top:10px;"></div>
  </div>
</div>

<script>
// HARDCODED PRODUCTION URL
const PRODUCTION_API = 'http://booktables-001-site1.anytempurl.com';
const API_BASE = PRODUCTION_API;
const HUB_URL = `${API_BASE}/hubs/driver`;

document.getElementById('apiUrl').textContent = PRODUCTION_API;

let connection = null;

const log = (message, type = 'info') => {
  const logEl = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
};

const updateStatus = (connected) => {
  const statusEl = document.getElementById('connStatus');
  statusEl.textContent = connected ? 'CONNECTED' : 'DISCONNECTED';
  statusEl.className = connected ? 'status connected' : 'status disconnected';
  
  document.getElementById('connectBtn').style.display = connected ? 'none' : 'block';
  document.getElementById('disconnectBtn').style.display = connected ? 'block' : 'none';
};

// Connect to SignalR
document.getElementById('connectBtn').onclick = async () => {
  try {
    log(`?? Connecting to PRODUCTION SignalR: ${HUB_URL}`, 'warning');
    
    connection = new signalR.HubConnectionBuilder()
      .withUrl(HUB_URL)
      .withAutomaticReconnect()
      .build();

    connection.on('NewRideRequest', (eventType, payload) => {
      log(`?? New Ride Request: ${JSON.stringify(payload)}`, 'success');
    });

    connection.on('RideStatusUpdated', (rideId, eventType, payload) => {
      log(`?? Ride #${rideId} Status: ${eventType} - ${JSON.stringify(payload)}`, 'info');
    });

    connection.on('DriverLocationUpdated', (driverId, lat, lng) => {
      log(`?? Driver #${driverId} Location: (${lat.toFixed(5)}, ${lng.toFixed(5)})`, 'info');
    });

    connection.onreconnected(() => {
      log('?? Reconnected to SignalR', 'success');
    });

    connection.onclose(() => {
      updateStatus(false);
      log('? SignalR connection closed', 'error');
      connection = null;
    });

    await connection.start();
    updateStatus(true);
    log('? Connected to PRODUCTION SignalR successfully!', 'success');

    // Subscribe to driver channel
    const driverId = document.getElementById('driverId').value;
    await connection.invoke('SubscribeDriver', driverId);
    log(`? Subscribed to driver:${driverId}`, 'success');

  } catch (err) {
    log(`? Connection failed: ${err.message}`, 'error');
    console.error('SignalR connection error:', err);
  }
};

// Disconnect from SignalR
document.getElementById('disconnectBtn').onclick = async () => {
  if (connection) {
    await connection.stop();
    log('?? Disconnected from SignalR', 'warning');
  }
};

// Update Location
document.getElementById('updateBtn').onclick = async () => {
  try {
    const driverId = parseInt(document.getElementById('driverId').value);
    const latitude = parseFloat(document.getElementById('latitude').value);
    const longitude = parseFloat(document.getElementById('longitude').value);
    const vehicleType = document.getElementById('vehicleType').value;
    const driverStatus = document.getElementById('driverStatus').value;

    log(`?? Sending location update to PRODUCTION: Driver #${driverId} - (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`, 'warning');

    const response = await fetch(`${API_BASE}/api/driver/location`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        driverId: driverId,
        lat: latitude,
        lng: longitude,
        vehicleType: vehicleType,
        statusOptional: driverStatus
      })
    });

    const data = await response.json();

    if (response.ok) {
      log(`? Location updated successfully: ${JSON.stringify(data)}`, 'success');
    } else {
      log(`? Update failed (${response.status}): ${JSON.stringify(data)}`, 'error');
    }

  } catch (err) {
    log(`? Update error: ${err.message}`, 'error');
    console.error('Location update error:', err);
  }
};

// Random Location
document.getElementById('randomBtn').onclick = () => {
  const baseLat = 40.40308;
  const baseLng = 49.87080;
  const randomLat = baseLat + (Math.random() - 0.5) * 0.01;
  const randomLng = baseLng + (Math.random() - 0.5) * 0.01;
  
  document.getElementById('latitude').value = randomLat.toFixed(5);
  document.getElementById('longitude').value = randomLng.toFixed(5);
  
  log(`?? Random location generated: (${randomLat.toFixed(5)}, ${randomLng.toFixed(5)})`, 'info');
};

// Clear Log
document.getElementById('clearBtn').onclick = () => {
  document.getElementById('log').innerHTML = '';
  log('??? Log cleared', 'info');
};

// Initial log
log('?? Production Test Panel Ready', 'success');
log(`?? PRODUCTION API: ${PRODUCTION_API}`, 'warning');
log(`?? SignalR Hub: ${HUB_URL}`, 'info');
log('?? Click "Connect to Production SignalR" to start', 'warning');
log('?? All requests go to LIVE PRODUCTION server!', 'error');
</script>
</body>
</html>
